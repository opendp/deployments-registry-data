  dp_variant:
    variant_name: Zero-concentrated DP
    variant_name_details: |
      Stage one uses Per-Record Differential Privacy (PRDP) [citation](#about). Establishments are split into smaller pieces and a DP mechanism is then run on the split data (slides 29-30) [citation](#webinar_slides).
      The paper defines the zCDP form of this guarantee, P-per-record zCDP (P-PRzCDP): the privacy loss of each record is bounded by a public policy function P(r) of that record's values. Any rho-zCDP mechanism satisfies P-PRzCDP with the constant policy P(r) = rho (Definition 6 and Lemma 1, p. 3140) [citation](#prdp_paper).
      This record keeps "Zero-concentrated DP" because the budget is reported in rho-zCDP terms and the schema has no per-record variant. "Custom" may fit better.
