    unprotected_quantities: '' # TODO
  privacy_loss:
    privacy_unit: Business establishment
    privacy_unit_details: |
      "[D]ata are protected with Per-Record Differential Privacy (PRDP).  This stage ensures that every establishment in the CBP database receives a provable privacy guarantee with respect to its existence." [citation](#about)
      Adjacent datasets differ by adding or removing one original establishment record (slide 30) [citation](#webinar_slides); see also Definition 6, p. 3140 [citation](#prdp_paper).
      The protection is not the same for every establishment. Establishments are split into pieces before noise is added (slides 29-30), and an establishment split into more pieces gets a weaker guarantee. The two sources state this bound in different terms:
      - The slides use pure DP: P(r) = |A(r)| x epsilon, where |A(r)| is the number of pieces record r is split into (slide 30) [citation](#webinar_slides).
      - The paper uses zCDP: running a rho-zCDP mechanism on the split data gives the original record P(r) = |A(r)|^2 x rho (Lemma 8, p. 3142) [citation](#prdp_paper).
      The slides list a theta for three of the four measures: annual payroll (theta = $100,000), first quarter payroll (theta = $25,000), and employment (theta = 4); none is listed for the establishment count (slides 50-51) [citation](#webinar_slides). Reading theta as the splitting threshold is an inference from the example on slide 47 ("PRDP with theta = 10 and rho = 0.1"). The Census Bureau materials checked for this record do not define theta.
      The Round 1 demonstration tables were computed from "synthetic microdata created solely from previously published CBP results" [citation](#demo_tables), so the establishments covered by this guarantee are the records of that synthetic input.
    privacy_parameters:
      rho: 12.058
    privacy_parameters_details: |
      "Noise added in the PRDP stage is randomly sampled from a discrete Gaussian distribution, and the total rho-zCDP privacy loss budget is 12.058." [citation](#about)
      12.058 is the sum of the stage one budgets for four measures: establishments 5.066, annual payroll 1.381, first quarter payroll 1.702, and employment 3.909. These values meet the quality target that 95% of cells with at least 25 establishments have a CV of 0.10 or less (slides 50-51) [citation](#webinar_slides).
      12.058 is therefore a total across measures, and the sources do not present it as a bound that applies to every original establishment. The slides list a theta for three of the four measures and none for the establishment count (slides 50-51). The materials checked for this record do not give a common splitting factor that would turn 12.058 into a bound for each establishment, and they give no figures for split establishments.
      Inference, not stated by the Census Bureau: for an establishment that is not split under any of the four measures, zCDP composition gives an upper-bound parameter of rho = 12.058 for stage one [citation](#prdp_paper).
      Stage two adds noise so that establishments in sparse cells get a minimum level of relative protection [citation](#about). The slides describe this stage as "Not formally private" (slide 46) [citation](#webinar_slides).
